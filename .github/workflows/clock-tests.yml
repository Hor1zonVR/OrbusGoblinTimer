name: GoblinTimer clock checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test timing and announcement matcher (no private game files)
        run: dotnet run --project tests/ClockSmokeTests/ClockSmokeTests.csproj --configuration Release
