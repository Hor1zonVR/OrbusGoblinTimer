name: Publish GoblinTimer
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Preview for testing; stable appears in RebornManager
        required: true
        type: choice
        default: preview
        options: [preview, stable]

permissions:
  contents: write

concurrency:
  group: goblintimer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check pure clock math and announcement matching
        shell: pwsh
        run: |
          dotnet run --project tests/ClockSmokeTests/ClockSmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Clock tests failed.' }
      - name: Verify private build-reference configuration
        shell: pwsh
        env:
          REFS_REPO: ${{ vars.GOBLINTIMER_BUILD_REFS_REPO }}
          REFS_TOKEN: ${{ secrets.GOBLINTIMER_BUILD_REFS_TOKEN }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish only from main.' }
          if ([string]::IsNullOrWhiteSpace($env:REFS_REPO) -or [string]::IsNullOrWhiteSpace($env:REFS_TOKEN)) {
            throw 'Set GOBLINTIMER_BUILD_REFS_REPO and GOBLINTIMER_BUILD_REFS_TOKEN from the existing private refs repository.'
          }
          if ($env:REFS_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Bad build-ref repository.' }
      - name: Retrieve existing private IL2CPP build references
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GOBLINTIMER_BUILD_REFS_TOKEN }}
          REFS_REPO: ${{ vars.GOBLINTIMER_BUILD_REFS_REPO }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .build-refs | Out-Null
          gh release download refs-v1 --repo $env:REFS_REPO --pattern 'RebornCamBuildRefs.zip' --dir .build-refs
          if ($LASTEXITCODE -ne 0) { throw 'Private refs download failed.' }
          $game = Join-Path (Resolve-Path .build-refs).Path 'game'
          Expand-Archive .build-refs/RebornCamBuildRefs.zip -DestinationPath $game
          foreach ($file in @('BepInEx/core/BepInEx.Core.dll', 'BepInEx/core/BepInEx.Unity.IL2CPP.dll',
            'BepInEx/core/Il2CppInterop.Runtime.dll', 'BepInEx/core/0Harmony.dll',
            'BepInEx/interop/Il2Cppmscorlib.dll', 'BepInEx/interop/UnityEngine.CoreModule.dll',
            'BepInEx/interop/UnityEngine.TextRenderingModule.dll')) {
              if (!(Test-Path (Join-Path $game $file))) { throw "Missing reference: $file" }
          }
          "GT_GAME_REFS=$game" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile actual plugin
        shell: pwsh
        run: |
          dotnet build src/OrbusGoblinTimer/OrbusGoblinTimer.csproj -c Release "-p:GameDir=$env:GT_GAME_REFS"
          if ($LASTEXITCODE -ne 0) { throw 'Plugin compilation failed.' }
          if (!(Test-Path 'src/OrbusGoblinTimer/bin/Release/net6.0/OrbusGoblinTimer.dll')) { throw 'DLL missing.' }
      - name: Resolve version and release mode
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $source = Get-Content src/OrbusGoblinTimer/Plugin.cs -Raw
          $m = [regex]::Match($source, '\[BepInPlugin\(\s*"[^"]+"\s*,\s*"[^"]+"\s*,\s*"(?<v>\d+\.\d+\.\d+)"')
          if (!$m.Success) { throw 'Plugin version was not found.' }
          $tag = 'v' + $m.Groups['v'].Value
          $mode = 'create'
          if ((git tag --list $tag) -eq $tag) {
            if ((git rev-list -n 1 $tag).Trim() -ne (git rev-parse HEAD).Trim()) { throw 'Existing tag points to older code; bump version.' }
            $prior = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isPrerelease --jq '.isPrerelease' 2>$null
            if ($LASTEXITCODE -ne 0 -or $env:CHANNEL -ne 'stable' -or $prior.Trim() -ne 'true') { throw 'Tag already published.' }
            $mode = 'promote'
          }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$mode" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish test or stable DLL
        if: steps.version.outputs.mode == 'create'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $dll = (Resolve-Path src/OrbusGoblinTimer/bin/Release/net6.0/OrbusGoblinTimer.dll).Path
          git tag $env:TAG
          git push origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed.' }
          $args = @('release','create',$env:TAG,$dll,'--repo',$env:GITHUB_REPOSITORY,
            '--title',"OrbusGoblinTimer $env:TAG",'--notes',
            'Experimental headset countdown. Requires first confirmed goblin announcement or F9 sync; actual event offsets on community servers are not yet verified.',
            '--verify-tag')
          if ($env:CHANNEL -eq 'preview') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release failed.' }
      - name: Promote tested preview for RM users
        if: steps.version.outputs.mode == 'promote'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.id) { throw 'Preview not found.' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F prerelease=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Promotion failed.' }
